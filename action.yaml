name: 'Update release assets'
description: 'Update Release.'
author: 'Nivaes'
inputs:
  # name:
  #   description: "Gives the release a custom name. Defaults to tag name"
  #   required: false
  tag_name:
    description: "Gives a tag name. Defaults to github.ref_name"
    required: false
  files:
    description: "Newline-delimited list of path globs for asset files to upload"
    required: false
runs:
  using: "composite"
  steps:
    # - name: Instalar dotnet-script
    #   shell: bash
    #   run: dotnet tool install -g dotnet-script
    
    - name: Update release
      id: run
      shell: bash
      run: |
        gh auth login

        gh release edit "${{ inputs.tag_name }}" \
          --title "Nuevo título de la release" \
          --notes "Nueva descripción de la release"

        gh release delete "${{ inputs.tag_name }}" --archive -y

        gh release upload "${{ inputs.tag_name }}" ${{ inputs.files }} -clobber

branding:
  icon: 'tag'
  color: 'gray-dark'
